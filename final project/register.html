<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Drift Racing Club</title>

    <meta name="description" content="Register for Drift Racing Club events.">
    <meta name="author" content="Promise Oghene">

    <link rel="icon" href="images/favicon_2.png" type="image/png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/large.css">

    <!-- JavaScript -->
    <script src="scripts/navigation.js" defer></script>
    <script src="scripts/footer.js" defer></script>
</head>

<body>

<header>

    <div class="logo">
        <i class="fa-solid fa-flag-checkered"></i>
        <span>Drift Racing Club</span>
    </div>

    <button id="menuButton" aria-label="Open Navigation Menu">
        ☰
    </button>

    <nav id="navigation">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="events.html">Events</a></li>
            <li><a href="drivers.html">Drivers</a></li>
            <li><a href="contacts.html">Contacts</a></li>
        </ul>
    </nav>

</header>

<main>

<section class="page-banner">
    <h1>Event Registration</h1>
    <p>Complete the form below to register for an upcoming Drift Racing Club event.</p>
</section>

<section class="registration">

<form action="thankyou.html" method="get">

    <label for="fname">Full Name *</label>
    <input
        type="text"
        id="fname"
        name="fullname"
        required>

    <label for="email">Email Address *</label>
    <input
        type="email"
        id="email"
        name="email"
        placeholder="example@email.com"
        required>

    <label for="phone">Phone Number *</label>
    <input
        type="tel"
        id="phone"
        name="phone"
        required>

    <label for="age">Age</label>
    <input
        type="number"
        id="age"
        name="age"
        min="16">

    <label for="gender">Gender</label>
    <select id="gender" name="gender">

        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>

    </select>

    <label for="event">Select Event *</label>

    <select id="event" name="event" required>

        <option value="">Choose an Event</option>

        <option>Drift Championship Round 1</option>
        <option>Night Drift Festival</option>
        <option>Drift Skills Workshop</option>
        <option>Pro-Am Drift Challenge</option>
        <option>Summer Drift Festival</option>
        <option>National Drift Finals</option>

    </select>

    <label for="experience">Experience Level</label>

    <select id="experience" name="experience">

        <option>Beginner</option>
        <option>Intermediate</option>
        <option>Professional</option>

    </select>

    <label for="comments">Additional Comments</label>

    <textarea
        id="comments"
        name="comments"
        rows="5"></textarea>

    <input
        class="btn submit-btn"
        type="submit"
        value="Register">

</form>

</section>

</main>

<footer>

    <div class="footer-content">

        <p><strong>Drift Racing Club</strong></p>

        <p>
            <i class="fa-solid fa-location-dot"></i>
            Lagos, Nigeria
        </p>

        <p>
            <i class="fa-solid fa-phone"></i>
            +234 800 123 4567
        </p>

        <p>
            <i class="fa-solid fa-envelope"></i>
            info@driftracingclub.com
        </p>

    </div>

    <hr>

    <p>
        © <span id="currentYear"></span>
        Drift Racing Club | Promise Oghene
    </p>

    <p>
        Last Modified:
        <span id="lastModified"></span>
    </p>

</footer>

</body>
</html>
